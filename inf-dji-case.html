<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Экшен-камера DJI</title>
<style>
  /* Лента в натуральную величину (2280 x 760). Окно кейса измеряет её и
     масштабирует по своей высоте — так же, как у Санька. */
  html,body{margin:0;padding:0;background:#fff;overflow:hidden;}
  .lane{position:relative;width:2280px;height:760px;}
  .lane img{position:absolute;top:0;height:760px;display:block;border:0;}
</style>
</head>
<body>
<div class="lane" data-stops="0,570,1140,1710,2280">
  <img src="cases/inf-dji-ribbon/01.jpg" style="left:0px;width:571px" alt="" fetchpriority="high">
  <img src="cases/inf-dji-ribbon/02.jpg" style="left:570px;width:571px" alt="" fetchpriority="high">
  <img src="cases/inf-dji-ribbon/03.jpg" style="left:1140px;width:571px" alt="" loading="lazy">
  <img src="cases/inf-dji-ribbon/04.jpg" style="left:1710px;width:570px" alt="" loading="lazy">
</div>
</body>
</html>
