<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Протектор — съёмка</title>
<style>
  /* Лента в натуральную величину (3930 x 760). Окно кейса измеряет её и
     масштабирует по своей высоте — так же, как у Санька. */
  html,body{margin:0;padding:0;background:#fff;overflow:hidden;}
  .lane{position:relative;width:3930px;height:760px;}
  .lane img{position:absolute;top:0;height:760px;display:block;border:0;}
</style>
</head>
<body>
<div class="lane" data-stops="0,1142,2283,3423,3930">
  <img src="cases/protector-ribbon/01.jpg" style="left:0px;width:1143px" alt="" fetchpriority="high">
  <img src="cases/protector-ribbon/02.jpg" style="left:1142px;width:1142px" alt="" fetchpriority="high">
  <img src="cases/protector-ribbon/03.jpg" style="left:2283px;width:1141px" alt="" loading="lazy">
  <img src="cases/protector-ribbon/04.jpg" style="left:3423px;width:507px" alt="" loading="lazy">
</div>
</body>
</html>
