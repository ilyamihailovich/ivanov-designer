<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Краш-тест — съёмка</title>
<style>
  /* Лента в натуральную величину (3208 x 760). Окно кейса измеряет её и
     масштабирует по своей высоте — так же, как у Санька. */
  html,body{margin:0;padding:0;background:#fff;overflow:hidden;}
  .lane{position:relative;width:3208px;height:760px;}
  .lane img{position:absolute;top:0;height:760px;display:block;border:0;}
</style>
</head>
<body>
<div class="lane" data-stops="0,1140,1604,2068,3208">
  <img src="cases/crash-ribbon/01.jpg" style="left:0px;width:1141px" alt="" fetchpriority="high">
  <img src="cases/crash-ribbon/02.jpg" style="left:1140px;width:465px" alt="" fetchpriority="high">
  <img src="cases/crash-ribbon/03.jpg" style="left:1604px;width:465px" alt="" loading="lazy">
  <img src="cases/crash-ribbon/04.jpg" style="left:2068px;width:1140px" alt="" loading="lazy">
</div>
</body>
</html>
