<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Крим — съёмка</title>
<style>
  /* Лента в натуральную величину (1824 x 760). Окно кейса измеряет её и
     масштабирует по своей высоте — так же, как у Санька. */
  html,body{margin:0;padding:0;background:#fff;overflow:hidden;}
  .lane{position:relative;width:1824px;height:760px;}
  .lane img{position:absolute;top:0;height:760px;display:block;border:0;}
</style>
</head>
<body>
<div class="lane" data-stops="0,608,1216,1824">
  <img src="cases/melting-ribbon/01.jpg" style="left:0px;width:609px" alt="" fetchpriority="high">
  <img src="cases/melting-ribbon/02.jpg" style="left:608px;width:609px" alt="" fetchpriority="high">
  <img src="cases/melting-ribbon/03.jpg" style="left:1216px;width:608px" alt="" loading="lazy">
</div>
</body>
</html>
