<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLOFF — презентация бренда</title>
<style>
  /* Лента выложена в натуральную величину макета (6636 x 760). Окно кейса
     само измеряет эту ширину и масштабирует кадр по своей высоте — так же,
     как это сделано для Санька. */
  html,body{margin:0;padding:0;background:#fff;overflow:hidden;}
  .lane{position:relative;width:6636px;height:760px;font-size:0;white-space:nowrap;}
  .lane img{display:inline-block;height:760px;vertical-align:top;border:0;}
</style>
</head>
<body>
<div class="lane">
  <img src="cases/gloff-ribbon/01.jpg" width="700" height="760" alt="" fetchpriority="high">
  <img src="cases/gloff-ribbon/02.jpg" width="700" height="760" alt="" fetchpriority="high">
  <img src="cases/gloff-ribbon/03.jpg" width="700" height="760" alt="" loading="lazy">
  <img src="cases/gloff-ribbon/04.jpg" width="700" height="760" alt="" loading="lazy">
  <img src="cases/gloff-ribbon/05.jpg" width="700" height="760" alt="" loading="lazy">
  <img src="cases/gloff-ribbon/06.jpg" width="700" height="760" alt="" loading="lazy">
  <img src="cases/gloff-ribbon/07.jpg" width="700" height="760" alt="" loading="lazy">
  <img src="cases/gloff-ribbon/08.jpg" width="700" height="760" alt="" loading="lazy">
  <img src="cases/gloff-ribbon/09.jpg" width="700" height="760" alt="" loading="lazy">
  <img src="cases/gloff-ribbon/10.jpg" width="336" height="760" alt="" loading="lazy">
</div>
</body>
</html>
